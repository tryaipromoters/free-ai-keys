name: daily

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe and render
        run: python3 scripts/sync.py --prune

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/status.json keys/
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh $(date -u +%Y-%m-%d_%H:%M)"
          git push
